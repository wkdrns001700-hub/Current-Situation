<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영문 이름 종합 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">영문 이름 제출</h1>
        
        <!-- 입력 폼 -->
        <form id="nameForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">한글 이름</label>
                <input type="text" id="koreanName" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="예: 홍길동">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">영문 이름 (여권 등재용)</label>
                <input type="text" id="englishName" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="예: HONG GILDONG">
            </div>
            <button type="submit" 
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-semibold">
                제출하기
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <!-- 제출된 현황 요약 -->
    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-md mt-6">
        <h2 class="text-lg font-bold text-gray-800 mb-3">제출 현황 (<span id="count">0</span>명)</h2>
        <div class="max-h-40 overflow-y-auto border border-gray-200 rounded-md p-2">
            <ul id="nameList" class="space-y-1 text-sm text-gray-600">
                <!-- 실시간으로 제출된 리스트가 표시됩니다 -->
            </ul>
        </div>
    </div>

    <!-- Firebase SDK 및 연동 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 본인 파이어베이스 설정 정보 적용 완료
        const firebaseConfig = {
            apiKey: "AIzaSyDYr7B415Z0onXBcHk-VdWYoEzeWi1rQL8",
            authDomain: "name-collector-fbf83.firebaseapp.com",
            databaseURL: "https://name-collector-fbf83-default-rtdb.firebaseio.com",
            projectId: "name-collector-fbf83",
            storageBucket: "name-collector-fbf83.firebasestorage.app",
            messagingSenderId: "487664795850",
            appId: "1:487664795850:web:d048e26e888d51e5d7f433",
            measurementId: "G-T2CRZSEV09"
        };

        // 파이어베이스 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const form = document.getElementById('nameForm');
        const statusMessage = document.getElementById('statusMessage');
        const nameList = document.getElementById('nameList');
        const countSpan = document.getElementById('count');

        // 1. 데이터 제출 이벤트 리스너
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const korean = document.getElementById('koreanName').value.trim();
            const english = document.getElementById('englishName').value.trim();

            push(ref(db, 'submissions'), {
                koreanName: korean,
                englishName: english,
                timestamp: Date.now()
            }).then(() => {
                statusMessage.textContent = "성공적으로 제출되었습니다!";
                statusMessage.className = "mt-4 text-center text-sm font-medium text-green-600";
                form.reset();
            }).catch((error) => {
                statusMessage.textContent = "제출 실패: " + error.message;
                statusMessage.className = "mt-4 text-center text-sm font-medium text-red-600";
            });
        });

        // 2. 실시간 데이터 불러와서 화면에 뿌려주기
        const submissionsRef = ref(db, 'submissions');
        onValue(submissionsRef, (snapshot) => {
            nameList.innerHTML = '';
            let count = 0;
            
            const data = snapshot.val();
            if (data) {
                const entries = Object.values(data);
                count = entries.length;
                
                entries.forEach((item) => {
                    const li = document.createElement('li');
                    li.textContent = `${item.koreanName} (${item.englishName})`;
                    nameList.appendChild(li);
                });
            }
            countSpan.textContent = count;
        });
    </script>
</body>
</html>
